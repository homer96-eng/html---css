<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Saint';
            src: url('fonts/SaintCarell_PERSONAL_USE_ONLY.otf') format('opentype');
            font-weight: normal;
            font-style: normal;

            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-att (Apple Advanced Typography)
                - svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Saint', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Rômesson Gomes de Sousa</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Incidunt distinctio, in molestiae esse commodi culpa. Quo, fuga, nihil commodi impedit cupiditate illum iusto corporis rem neque sint sunt totam adipisci?</p>
    
</body>
</html>
