<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            font-weight: bold;
        }
        a:visited {
            color: darkred;      
        }
        a:hover {
            color: black;
            text-decoration: none;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: burlywood;
        }
        .especial::before {
            content: '➡️';
        }
        .especial::after {
            content: '⬅️';
        }
        a::after {
            content: ' link';
            font-weight: normal;
            color: darkgray;
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/" class="especial">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@romessonsousa4538">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-2-de-5-40-horas/">Site do CursoEmVideo</a></li>
    </ul>
    
</body>
</html>
